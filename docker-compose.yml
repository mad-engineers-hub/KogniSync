services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kognisync-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kognisync}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kognisync_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kognisync_db}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kognisync} -d ${POSTGRES_DB:-kognisync_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kognisync-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Optional Valhalla OpenStreetMap routing profile (M3.1 / M3.2)
  # Activated only via: docker compose --profile valhalla up -d
  # Safe for Windows 11 Docker Desktop with conservative memory limits (elevation/admins disabled)
  valhalla:
    profiles: ["valhalla"]
    image: ghcr.io/gis-ops/docker-valhalla/valhalla:latest@sha256:060da5b92e6024a67f65135c236d918b021d63e73d1808a0d55b7e7cbd17240c
    container_name: kognisync-valhalla
    restart: unless-stopped
    ports:
      - "${VALHALLA_PORT:-8002}:8002"
    environment:
      - tile_urls=${VALHALLA_TILE_URLS:-}
      - use_tiles_ignore_pbf=${VALHALLA_USE_TILES_IGNORE_PBF:-True}
      - force_rebuild=${VALHALLA_FORCE_REBUILD:-False}
      - build_elevation=False
      - build_admins=False
      - build_time_zones=False
      - server_threads=2
    volumes:
      - valhalla_data:/custom_files
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  redis_data:
  valhalla_data:
