# A generic, single database configuration for KogniSync (backend directory context).

[alembic]
# Path to migration scripts relative to backend directory
script_location = %(here)s/alembic

# Sys.path prepended with backend directory
prepend_sys_path = %(here)s

path_separator = os

# Output encoding
output_encoding = utf-8

# Placeholder database URL (actual URL is dynamically retrieved from app.core.config.settings)
sqlalchemy.url = 

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

