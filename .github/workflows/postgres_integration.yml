name: PostgreSQL Integration & Booking Safety Gate

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main, 'feature/**' ]

permissions:
  contents: read

jobs:
  postgres-integration:
    name: PostgreSQL 16 & Redis 7 Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: kognisync
          POSTGRES_PASSWORD: kognisync_pass
          POSTGRES_DB: kognisync_db
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio anyio httpx

      - name: Generate ephemeral CI test credentials
        run: |
          JWT_KEY=$(python -c "import secrets; print(secrets.token_urlsafe(36))")
          INT_KEY=$(python -c "import secrets; print(secrets.token_hex(24))")
          ELEV_KEY=$(python -c "import secrets; print(secrets.token_hex(24))")
          echo "::add-mask::$JWT_KEY"
          echo "::add-mask::$INT_KEY"
          echo "::add-mask::$ELEV_KEY"
          echo "CI_JWT_SECRET_KEY=$JWT_KEY" >> "$GITHUB_ENV"
          echo "CI_INTERNAL_API_KEY=$INT_KEY" >> "$GITHUB_ENV"
          echo "CI_TRANSIT_POLL_ELEVATED_KEY=$ELEV_KEY" >> "$GITHUB_ENV"

      - name: Run Alembic migrations to head
        env:
          ALLOW_DESTRUCTIVE_DB_INIT: "true"
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5434
          POSTGRES_USER: kognisync
          POSTGRES_PASSWORD: kognisync_pass
          POSTGRES_DB: kognisync_db
          DATABASE_URL: postgresql+asyncpg://kognisync:kognisync_pass@localhost:5434/kognisync_db
          JWT_SECRET_KEY: ${{ env.CI_JWT_SECRET_KEY }}
          INTERNAL_API_KEY: ${{ env.CI_INTERNAL_API_KEY }}
          PYTHONPATH: .
        run: |
          python scripts/init_db.py --force-destructive
          python scripts/migrate.py upgrade
          python scripts/migrate.py check

      - name: Execute PostgreSQL Concurrency & Locking Tests
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://kognisync:kognisync_pass@localhost:5434/kognisync_db
          REDIS_URL: redis://localhost:6380/0
          JWT_SECRET_KEY: ${{ env.CI_JWT_SECRET_KEY }}
          INTERNAL_API_KEY: ${{ env.CI_INTERNAL_API_KEY }}
          TRANSIT_POLL_ELEVATED_KEY: ${{ env.CI_TRANSIT_POLL_ELEVATED_KEY }}
          PYTHONPATH: backend:.
        run: |
          pytest backend/tests/test_postgres_integration.py -v -rs

      - name: Execute Full Backend Test Suite
        env:
          POSTGRES_TEST_DATABASE_URL: postgresql+asyncpg://kognisync:kognisync_pass@localhost:5434/kognisync_db
          REDIS_URL: redis://localhost:6380/0
          JWT_SECRET_KEY: ${{ env.CI_JWT_SECRET_KEY }}
          INTERNAL_API_KEY: ${{ env.CI_INTERNAL_API_KEY }}
          TRANSIT_POLL_ELEVATED_KEY: ${{ env.CI_TRANSIT_POLL_ELEVATED_KEY }}
          PYTHONPATH: backend:.
        run: |
          pytest backend/tests -v -rs
